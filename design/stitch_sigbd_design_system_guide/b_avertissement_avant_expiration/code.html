h-4 w-32 bg-surface-container-highest rounded"></div></div><div class="flex items-center gap-space-md"><div class="h-4 w-20 bg-surface-container-highest rounded"></div><div class="h-8 w-8 rounded-full bg-surface-container-highest"></div></div></header><div class="flex-1 flex"><aside class="w-64 bg-surface-container-low p-space-md flex flex-col gap-space-sm"><div class="h-8 w-full bg-surface-container rounded-lg mb-space-md"></div><div class="h-6 w-3/4 bg-surface-container-highest rounded"></div><div class="h-6 w-4/5 bg-surface-container-highest rounded"></div><div class="h-6 w-2/3 bg-surface-container-highest rounded"></div><div class="h-6 w-3/4 bg-surface-container-highest rounded"></div></aside><main class="flex-1 p-margin-desktop flex flex-col gap-space-lg"><div class="h-10 w-64 bg-surface-container-highest rounded"></div><div class="grid grid-cols-4 gap-gutter-desktop"><div class="h-28 bg-surface-container-lowest rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></div><div class="h-28 bg-surface-container-lowest rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></div><div class="h-28 bg-surface-container-lowest rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></div><div class="h-28 bg-surface-container-lowest rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></div></div><div class="flex-1 bg-surface-container-lowest rounded-lg shadow-[0_1px_8px_rgba(0,0,0,0.04)]"></div></main></div></div><div class="fixed inset-0 z-40 bg-[#0B2A4A]/40 backdrop-blur-sm flex items-center justify-center p-space-md"><main class="relative z-50 w-full flex items-center justify-center"><div class="flex flex-col w-full items-center justify-center min-h-[calc(100vh-4rem)] p-space-md select-none">
<!-- Modal Card -->
<div class="relative z-50 w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-[0_16px_40px_rgba(11,42,74,0.16)] p-space-xl flex flex-col items-center text-center">
<!-- Warning Icon with Ambient Pulse -->
<div class="relative flex items-center justify-center mb-5">
<div class="w-16 h-16 rounded-full bg-[#FFF4E0] flex items-center justify-center text-[#B7791F]">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<!-- Subtle pulse halo -->
<div class="absolute inset-0 rounded-full bg-[#B7791F]/15 animate-ping opacity-60 pointer-events-none"></div>
</div>
<!-- Modal Title -->
<h1 class="text-headline-lg font-headline-lg text-[#0B2A4A] tracking-tight mb-3">
      Votre session va expirer
    </h1>
<!-- Subtitle / Warning Note -->
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[380px] leading-relaxed mb-2">
      Sans activité de votre part, vous serez déconnecté dans
    </p>
<!-- Large Dynamic Countdown Timer -->
<div class="mb-3 flex items-center justify-center">
<span class="text-[40px] leading-[48px] font-headline-xl font-bold tracking-widest tabular-nums text-error" id="session-countdown">00:00</span>
</div>
<!-- Security Assurance Microcopy -->
<p class="text-body-sm font-body-sm text-on-surface-variant mb-6">
      Vos brouillons enregistrés ne seront pas perdus.
    </p>
<!-- Progress indicator line -->
<div class="w-full bg-surface-container h-1 rounded-full overflow-hidden mb-6">
<div class="h-full w-full transition-all duration-1000 ease-linear rounded-full bg-error" id="session-progress" style="width: 0%;"></div>
</div>
<!-- Modal Action Buttons -->
<div class="w-full flex items-center gap-3">
<!-- Stay Connected (Primary) -->
<button aria-label="Prolonger la session et rester connecté" class="flex-1 h-[44px] rounded-lg bg-primary-container hover:bg-[#174C87] active:bg-[#133E6E] text-on-primary font-label-lg text-label-lg transition-colors flex items-center justify-center gap-space-xs cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="btn-keep-session" type="button">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="">Rester connecté</span>
</button>
<!-- Log out (Secondary) -->
<button aria-label="Se déconnecter immédiatement" class="flex-1 h-[44px] rounded-lg bg-surface-container-lowest hover:bg-surface-container-low active:bg-surface-container text-[#1A2433] font-label-lg text-label-lg shadow-sm transition-colors flex items-center justify-center gap-space-xs cursor-pointer focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2" id="btn-logout-session" type="button">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">logout</span>
<span class="">Se déconnecter</span>
</button>
</div>
<!-- Regulatory Security Watermark -->
<div class="mt-6 flex items-center justify-center gap-2 text-outline text-label-sm font-label-sm uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span class="">DGBF · SSEBF</span>
</div>
</div>
<script>
    (function() {
      var totalSeconds = 60;
      var remaining = totalSeconds;
      var countdownEl = document.getElementById('session-countdown');
      var progressEl = document.getElementById('session-progress');
      var keepBtn = document.getElementById('btn-keep-session');
      var logoutBtn = document.getElementById('btn-logout-session');

      function updateDisplay() {
        if (!countdownEl) return;
        var mins = Math.floor(remaining / 60);
        var secs = remaining % 60;
        var mStr = mins < 10 ? '0' + mins : '' + mins;
        var sStr = secs < 10 ? '0' + secs : '' + secs;
        countdownEl.textContent = mStr + ':' + sStr;
        
        if (progressEl) {
          var pct = Math.max(0, (remaining / totalSeconds) * 100);
          progressEl.style.width = pct + '%';
        }

        if (remaining <= 10) {
          countdownEl.classList.add('text-error');
          countdownEl.classList.remove('text-[#B7791F]');
          if (progressEl) {
            progressEl.classList.add('bg-error');
            progressEl.classList.remove('bg-[#B7791F]');
          }
        }
      }

      var timerInterval = setInterval(function() {
        if (remaining > 0) {
          remaining--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          if (countdownEl) countdownEl.textContent = '00:00';
        }
      }, 1000);

      if (keepBtn) {
        keepBtn.addEventListener('click', function() {
          remaining = 60;
          if (countdownEl) {
            countdownEl.classList.remove('text-error');
            countdownEl.classList.add('text-[#B7791F]');
          }
          if (progressEl) {
            progressEl.classList.remove('bg-error');
            progressEl.classList.add('bg-[#B7791F]');
          }
          updateDisplay();
        });
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', function() {
          remaining = 0;
          updateDisplay();
        });
      }
    })();
  </script>
</div></main></div>

</body></html>
